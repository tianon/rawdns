name: Smoke Test

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: 0 0 * * 0

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
      - uses: tianon/actions/setup-go@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
        with:
          go-version-file: go.mod
      - run: |
          go build -o rawdns ./cmd/rawdns
          go mod tidy
          git diff --exit-code

  dev:
    name: Dev
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
      - name: Build
        run: |
          docker buildx build --pull .

  test:
    name: Cross
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
      - name: Build
        run: |
          docker buildx build --pull --file Dockerfile.cross .

  prod:
    name: Prod
    runs-on: ubuntu-latest
    steps:
      - uses: tianon/actions/checkout/composite@581498642ee39d41dc3a801d22b3f7f42a95acc7 # HEAD
      - name: Build
        run: |
          docker buildx build --pull --file Dockerfile.production .
